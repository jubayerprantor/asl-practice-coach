name: Build Desktop Application

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release draft'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows NSIS
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Web Verification Pipeline
        run: npm run verify:web

      - name: Install Cloud Desktop Packaging Tools
        run: npm install -D electron@34.0.0 electron-builder

      - name: Package Desktop Installer (with distScan check)
        run: npm run build:desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASL-Practice-Coach-Windows-Setup
          path: release/*.exe
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
          draft: false
          prerelease: false
          body_path: docs/release-notes-v0.1.0.md
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
